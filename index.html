<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#25105b"><link rel="manifest" href="manifest.webmanifest"><title>STAR CATCH</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:radial-gradient(circle at top,#5632a0,#160b3c 70%);color:white;min-height:100vh;display:flex;justify-content:center}.app{width:min(100vw,520px);padding:16px;display:flex;flex-direction:column;gap:12px}h1{text-align:center;color:#ffe66d;margin:5px;text-shadow:0 3px 15px #ffb300}.stats{display:flex;justify-content:space-between;background:#ffffff20;border-radius:15px;padding:12px;font-weight:bold}#game{height:58vh;min-height:340px;background:linear-gradient(#25105b,#392079,#21104b);border:3px solid #a78bfa;border-radius:20px;position:relative;overflow:hidden;touch-action:none}#basket{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:54px}.star{position:absolute;font-size:30px}button{border:0;border-radius:14px;padding:14px;background:#ffdf4d;color:#25105b;font-size:1.1rem;font-weight:900}.controls{display:flex;gap:12px}.controls button{flex:1;font-size:1.5rem;touch-action:none}#message{text-align:center;color:#ffe66d;font-weight:bold;min-height:24px}.hint{text-align:center;color:#ddd4ff;font-size:.9rem}</style></head><body><main class="app"><h1>⭐ STAR CATCH ⭐</h1><div class="stats"><span>⭐ Puntos: <b id="score">0</b></span><span>❤️ Vidas: <b id="lives">3</b></span></div><div id="game"><div id="basket">🧺</div></div><div id="message">¡Atrapa 20 estrellas para ganar!</div><button id="start">▶ JUGAR</button><div class="controls"><button id="left">⬅️</button><button id="right">➡️</button></div><div class="hint">Mueve la canasta con el dedo o usa las flechas.</div></main>
<script>
const area=document.querySelector('#game'),basket=document.querySelector('#basket'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),msg=document.querySelector('#message'),start=document.querySelector('#start');let score=0,lives=3,playing=false,items=[],last=0,spawn=0,raf=0,move=0;
function setBasket(x){let w=basket.offsetWidth;basket.style.left=Math.max(w/2,Math.min(area.clientWidth-w/2,x))+'px'}
function reset(){items.forEach(o=>o.el.remove());items=[];score=0;lives=3;scoreEl.textContent=0;livesEl.textContent=3;setBasket(area.clientWidth/2);msg.textContent='¡Atrapa 20 estrellas!'}
function end(win){playing=false;cancelAnimationFrame(raf);msg.textContent=win?'🏆 ¡FELICIDADES! ¡Ganaste!':'💜 ¡Fin del juego! Inténtalo otra vez.';start.textContent='↻ VOLVER A JUGAR'}
function addStar(){let el=document.createElement('div');el.className='star';el.textContent='⭐';let x=Math.random()*(area.clientWidth-38);el.style.left=x+'px';el.style.top='-38px';area.appendChild(el);items.push({el,x,y:-38,speed:2.3+Math.random()*1.8})}
function loop(t){if(!playing)return;let dt=Math.min(2,(t-last)/16.67||1);last=t;spawn+=dt;if(spawn>38){addStar();spawn=0}let b=basket.getBoundingClientRect();for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=o.speed*dt;o.el.style.top=o.y+'px';let r=o.el.getBoundingClientRect();if(r.bottom>=b.top+8&&r.left<b.right&&r.right>b.left&&r.top<b.bottom){o.el.remove();items.splice(i,1);score++;scoreEl.textContent=score;if(score>=20){end(true);return}}else if(o.y>area.clientHeight){o.el.remove();items.splice(i,1);lives--;livesEl.textContent=lives;if(lives<=0){end(false);return}}}if(move)setBasket(parseFloat(basket.style.left||area.clientWidth/2)+move*5*dt);raf=requestAnimationFrame(loop)}
start.onclick=()=>{if(playing)return;reset();playing=true;start.textContent='JUGANDO…';last=performance.now();raf=requestAnimationFrame(loop)};
area.addEventListener('pointerdown',e=>{let r=area.getBoundingClientRect();setBasket(e.clientX-r.left);area.setPointerCapture(e.pointerId)});area.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=area.getBoundingClientRect();setBasket(e.clientX-r.left)}});
function hold(id,d){let el=document.querySelector(id);el.onpointerdown=e=>{e.preventDefault();move=d};['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>move=0))}hold('#left',-1);hold('#right',1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move=-1;if(e.key==='ArrowRight')move=1});document.addEventListener('keyup',()=>move=0);setBasket(area.clientWidth/2);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
